[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.serve"

[deploy]
startCommand = "streamlit run src/tamubot/app/streamlit.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
