# Sidecar: vLLM serving NuExtract3 with on-the-fly bitsandbytes 4-bit (Route A).
# Launch from the HOST (Windows/PowerShell), NOT from inside tamubot-dev-1:
#   cd docker/vllm-nuextract && docker compose up
# The dev container reaches it at http://host.docker.internal:8000/v1
# (set NUEXTRACT_SERVER_URL accordingly).
#
# Route B (offline W4A16 via llm-compressor) is unavailable on this stack:
# llm-compressor pins transformers 4.x, but NuExtract3 (model_type qwen3_5) needs
# transformers >=5.x to load. vLLM quantizes with bitsandbytes at load time instead.
#
# To enable MTP speculative decoding once basic serving is confirmed, append to command:
#   --speculative-config '{"method": "qwen3_next_mtp", "num_speculative_tokens": 2}'
services:
  nuextract-vllm:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    ports:
      - "8000:8000"
    volumes:
      - ../../.docker-cache/huggingface:/hfcache
    environment:
      - HF_HOME=/hfcache
      - HF_HUB_OFFLINE=1
    command: >
      --model numind/NuExtract3
      --served-model-name numind/NuExtract3
      --trust-remote-code
      --quantization bitsandbytes
      --limit-mm-per-prompt '{"image": 6, "video": 0}'
      --chat-template-content-format openai
      --max-model-len 8192
      --max-num-seqs 2
      --enforce-eager
      --gpu-memory-utilization 0.78
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
