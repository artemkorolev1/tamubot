services:
  dev:
    build: .
    # Launch Dagster UI (port 3000) in the background, then Streamlit (8501) as
    # the foreground/main process so both come up on every up/recreate/rebuild.
    command: 'bash -c "dagster dev -f src/tamubot/ingestion/pipeline_v6b/definitions.py --host 0.0.0.0 --port 3000 & exec streamlit run src/tamubot/app/streamlit.py --server.port 8501 --server.headless true"'
    volumes:
      - .:/workspace
      - C:/Users/iredl/.claude:/home/claude/.claude
      - C:/Users/iredl/.claude.json:/home/claude/.claude.json
      - C:/Users/iredl/.ssh:/home/claude/.ssh:ro
      - C:/Users/iredl/.gitconfig:/home/claude/.gitconfig:ro
      - C:/Users/iredl/.config/ccstatusline:/home/claude/.config/ccstatusline:ro
      - ./.docker-cache/pip:/home/claude/.cache/pip
      - ./.docker-cache/huggingface:/home/claude/.cache/huggingface
      - ./.docker-cache/torch:/home/claude/.cache/torch
      - dagster_home:/dagster_home
    env_file: .env
    ports:
      - "8501:8501"
      - "3000:3000"
      - "3001:3001"
    environment:
      - PYTHONPATH=/workspace:/workspace/src
      - TAMU_BASE_URL=http://api-proxy:8080/tamu
      - VOYAGE_BASE_URL=http://api-proxy:8080/voyage
      - PIP_USER=0
    mem_limit: 22g
    cpus: "11"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          memory: 8g
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      api-proxy:
        condition: service_started
      claude-perms:
        condition: service_completed_successfully
    restart: unless-stopped
    stdin_open: true
    tty: true

  # Heals Claude history dir permissions (root-created session dirs are
  # unreadable by the non-root 'claude' user) on every 'compose up'.
  claude-perms:
    image: busybox
    user: root
    volumes:
      - C:/Users/iredl/.claude:/claude
    command: ["sh", "-c", "mkdir -p /claude/projects/-workspace && find /claude/projects/-workspace -exec chmod a+rwx {} \\; ; echo claude-perms-done"]
    restart: "no"

  api-proxy:
    build: ./tools/api-proxy
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - API_PROXY_TAMU_SESSION=1000
    volumes:
      - ./logs:/workspace/logs

  beszel:
    image: henrygd/beszel:latest
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./.beszel-data:/beszel_data

  beszel-agent:
    image: henrygd/beszel-agent:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LISTEN=45876
      - KEY=${BESZEL_KEY:-}

volumes:
  dagster_home:
