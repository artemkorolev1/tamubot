services:
  dev:
    build: .
    command: streamlit run src/tamubot/app/streamlit.py --server.port 8501 --server.headless true
    volumes:
      - .:/workspace
      - C:/Users/iredl/.claude:/home/claude/.claude
      - C:/Users/iredl/.claude.json:/home/claude/.claude.json
      - C:/Users/iredl/.ssh:/home/claude/.ssh:ro
      - C:/Users/iredl/.gitconfig:/home/claude/.gitconfig:ro
      - C:/Users/iredl/.config/ccstatusline:/home/claude/.config/ccstatusline:ro
      - ./.docker-cache/pip:/home/claude/.cache/pip
      - ./.docker-cache/huggingface:/home/claude/.cache/huggingface
      - ./.docker-cache/torch:/home/claude/.cache/torch
      - dagster_home:/dagster_home
    env_file: .env
    ports:
      - "8501:8501"
      - "3000:3000"
      - "3001:3001"
    environment:
      - PYTHONPATH=/workspace:/workspace/src
      - TAMU_BASE_URL=http://api-proxy:8080/tamu
      - VOYAGE_BASE_URL=http://api-proxy:8080/voyage
      - PIP_USER=0
    mem_limit: 22g
    cpus: "11"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          memory: 8g
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on: [api-proxy]
    restart: unless-stopped
    stdin_open: true
    tty: true

  api-proxy:
    build: ./tools/api-proxy
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - API_PROXY_TAMU_SESSION=1000
    volumes:
      - ./logs:/workspace/logs

  beszel:
    image: henrygd/beszel:latest
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./.beszel-data:/beszel_data

  beszel-agent:
    image: henrygd/beszel-agent:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LISTEN=45876
      - KEY=${BESZEL_KEY:-}

volumes:
  dagster_home:
