[project]
name = "tamubot"
version = "0.1.0"
description = "RAG-based academic assistant for Texas A&M course and policy queries"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Artem Korolev" }]

[project.urls]
Repository = "https://github.com/artemkorolev1/tamubot"

[project.optional-dependencies]
v4 = [
    "langgraph>=1.1.2,<2.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0,<4.0.0",
    "haystack-ai>=2.25.2,<3.0.0",
    "mem0ai",
]
spike = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["tamubot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = [".", "src"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true

# Vendored third-party code — not ours to type-check (mirrors the ruff E501 ignore).
# `src/__init__.py` exists, so mypy names modules `src.tamubot.*`; cover both forms.
[[tool.mypy.overrides]]
module = [
    "tamubot.vendor.*",
    "tamubot.ingestion._vendor.*",
    "src.tamubot.vendor.*",
    "src.tamubot.ingestion._vendor.*",
]
ignore_errors = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/tamubot/evals/*.py" = ["E402", "E501"]
"src/tamubot/ingestion/process_syllabi.py" = ["E501"]
"src/tamubot/ingestion/process_syllabi_v3.py" = ["E501"]
"src/tamubot/ingestion/legacy/standardize_syllabi.py" = ["E501"]
"src/tamubot/ingestion/test_gemini_parse.py" = ["E501"]
"src/tamubot/tools/*.py" = ["E501"]
# Vendored third-party code — keep upstream formatting verbatim.
"src/tamubot/vendor/**/*.py" = ["E501"]
"src/tamubot/ingestion/_vendor/**/*.py" = ["E501"]
# Long embedded prompt / schema strings that must not be reflowed.
"src/tamubot/ingestion/filters/metadata_enrichment.py" = ["E501"]
"src/tamubot/ingestion/validators/llm_validator.py" = ["E501"]
"src/tamubot/ingestion/boilerplate_stripper.py" = ["E501"]
"src/tamubot/ingestion/pipeline_v6/assets/bronze_vlm.py" = ["E501"]
"src/tamubot/rag/prompts.py" = ["E501"]
# streamlit.py reloads tamubot.rag.* before importing — imports intentionally
# follow the reload loop (E402).
"src/tamubot/app/streamlit.py" = ["E402"]
