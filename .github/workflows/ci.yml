name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install serving deps + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-serve.txt
          pip install -e .
          pip install pytest pytest-asyncio mypy ruff

      - name: Lint
        run: ruff check src/tamubot/

      - name: Typecheck
        run: mypy src/tamubot/ --ignore-missing-imports

      - name: Test (guard)
        run: pytest tests/test_guard.py -v
