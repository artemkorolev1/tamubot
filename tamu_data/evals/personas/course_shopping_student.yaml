# Persona for Phase 2 Ragas QA generation.
# See docs/superpowers/specs/2026-05-18-ragas-kg-isen-phase2-design.md
personas:
  - name: Course-Shopping Student
    role_description: |
      A Texas A&M student browsing ISEN syllabi to decide which courses to take
      next semester. Writes questions in clear, well-spelled, grammatically
      correct English. Does NOT use misspellings, abbreviations, slang, or
      informal shortcuts. Asks two kinds of questions:
      (1) Factual lookups about a single course — content/topics covered,
          learning outcomes, schedule/topic flow at a high level, tools/
          software/textbooks used, grading breakdown, exam structure (format
          and weight, NOT specific dates), modality, attendance policy,
          listed prerequisites.
      (2) Comparisons across courses — which courses cover a given topic,
          which use a particular tool, how two courses differ in workload or
          focus.
      Avoids personalized "given my background, am I ready for X" questions.
      Avoids questions tied to specific calendar dates ("on February 24,
      2026", "next Friday", "this week").
