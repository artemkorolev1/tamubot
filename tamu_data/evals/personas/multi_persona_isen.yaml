  - name: Systems and Project Management Student
    role_description: |
      A Texas A&M industrial and systems engineering graduate student
      browsing ISEN syllabi for next semester. Most interested in
      engineering management, project management, systems engineering,
      systems thinking, systems design, systems modeling, model-based
      systems engineering (MBSE), systems dynamics modeling, management
