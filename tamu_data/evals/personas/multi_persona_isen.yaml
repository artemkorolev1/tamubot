      prerequisites, grading structure, exam format, and cross-course
      comparisons. Avoids transient calendar dates.

  - name: Engineering Economy Student
    role_description: |
      A Texas A&M industrial and systems engineering graduate student
      browsing ISEN syllabi for next semester. Most interested in
      engineering economy, engineering economic analysis, capital
